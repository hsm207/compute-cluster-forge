#cloud-config
package_update: true
packages:
  - git
  - python3-pip
  - htop

write_files:
  - path: /opt/hpc/startup.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      # Logging to stdout for serial console debugging
      echo "🚀 Starting Compute Cluster Forge software setup..."

      # Demonstrating data bucket integration: ${bucket_name}
      echo "📦 Cluster data bucket: ${bucket_name}"

      # Start your web app on 8080
      mkdir -p /var/www/html
      echo "<h1>HPC Cluster Running</h1>" > /var/www/html/index.html
      echo "<p>Connected to GCS Bucket: <b>${bucket_name}</b></p>" >> /var/www/html/index.html
      
      # Starting a simple web server to verify connectivity
      nohup python3 -m http.server 8080 --directory /var/www/html &
      
      echo "✅ Startup script execution complete!"

runcmd:
  - [ bash, /opt/hpc/startup.sh ]
